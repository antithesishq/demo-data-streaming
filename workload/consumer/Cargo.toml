[package]
name = "consumer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
antithesis_sdk = "0.1.5"
anyhow = "1.0"
aws-config = { version= "1.6.3", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.79.0"
axum = "0.7.9"
byteorder = "1.5"
chrono = "0.4"
clap = "2.18.0"
crc = "3.2"
env_logger = "0.10"
flate2 = { version = "1.0", optional = true }
fnv = "1.0.7"
getopts = "0.2.21"
hyper = "1.5.1"
kafka = "0.10"
lazy_static = "1.5"
log = "0.4.8"
openssl = { version = "0.10", optional = true }
openssl-sys = { version = "0.9", optional = true }
postgres-types = { version = "0.2", features = ["derive", "with-chrono-0_4"]}
rand = "0.8.5"
rdkafka = { version = "0.37", features = ["cmake-build"] }
ref_slice = "1.2.1"
reqwest = { version = "0.12.9", features = ["json"] }
serde = "1.0.216"
serde_json = "1.0.133"
serde_postgres = "0.2.0"
snap = { version = "1.1", optional = true }
strum = "0.24"
strum_macros = "0.24"
thiserror = "1.0"
time = "0.3"
tokio-postgres = { version = "0.7" }
tracing = "0.1"
tracing-subscriber = "0.3"
twox-hash = "1.6.3"
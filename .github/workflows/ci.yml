name: CI

on:
  schedule:
    - cron: "00 22 * * *"
  pull_request: 
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
        duration:
          type: string
          required: true
          default: '1'
          description: Duration to the test run
        emails:
          type: string
          required: true
          description: Email receipents

jobs:
  Demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log Into Demo Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.ANTITHESIS_GAR_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Config Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./config.Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/demo-data-streaming-config:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/demo-data-streaming-config:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Data Generator Image
        uses: docker/build-push-action@v5
        with:
          context: ./data-generator
          file: ./data-generator/faker.Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/data_generator:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/data_generator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push PostgreSQL Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./data-generator
          file: ./data-generator/pgsql_client.Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/pgsql_client:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/pgsql_client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push DynamoDB Image
        uses: docker/build-push-action@v5
        with:
          context: ./dynamoDb
          file: ./dynamoDb/Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/ddd:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/ddd:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Kafka Image
        uses: docker/build-push-action@v5
        with:
          context: ./kafka
          file: ./kafka/kafka.Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/kafka:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/kafka:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Consumer Image
        uses: docker/build-push-action@v5
        with:
          context: ./workload/consumer
          file: ./workload/consumer/Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/consumer:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/consumer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Producer Image
        uses: docker/build-push-action@v5
        with:
          context: ./workload/producer
          file: ./workload/producer/Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/producer:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/producer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build and Push Processor Image
        uses: docker/build-push-action@v5
        with:
          context: ./workload/processor
          file: ./workload/processor/Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/processor:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/processor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Validator Image
        uses: docker/build-push-action@v5
        with:
          context: ./workload/validator
          file: ./workload/validator/Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/validator:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/demo-repository/validator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output Image Tags
        run: |
          echo "Images pushed with tags:"
          echo "- demo-data-streaming-config:${{ github.sha }}"
          echo "- data_generator:${{ github.sha }}"
          echo "- pgsql_client:${{ github.sha }}"
          echo "- ddd:${{ github.sha }}"
          echo "- kafka:${{ github.sha }}"
          echo "- consumer:${{ github.sha }}"
          echo "- producer:${{ github.sha }}"
          echo "- processor:${{ github.sha }}"
          echo "- validator:${{ github.sha }}"

      - name: Trigger Test on Demo
        uses: antithesishq/antithesis-trigger-action@main
        with:
          notebook_name: async_platform
          tenant: demo
          username: ${{ secrets.ANTITHESIS_USER_NAME }}
          password: ${{ secrets.ANTITHESIS_PASSWORD }}
          github_token: ${{ secrets.GH_PAT }}
          config_image: demo-data-streaming-config:latest
          description: "[${{ github.repository }}] CI for ${{ github.ref_name }} (commit ${{ github.sha }})"
          email_recipients: ${{ github.event.inputs.emails || secrets.ZULIP_REPORT_EMAIL }}
          additional_parameters: |-
            custom.duration=${{ github.event.inputs.duration || '0.5' }}


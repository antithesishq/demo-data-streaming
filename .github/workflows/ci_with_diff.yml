name: CI with Diff (Rose Cheetah only)

on:
  push:
    branches:
      - test-git-diff
  workflow_dispatch:
    inputs:
        duration:
          type: string
          required: true
          default: '1'
          description: Duration to the test run
        emails:
          type: string
          required: true
          description: Email receipents

jobs:

  Rose-Cheetah:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log Into Rose Cheetah Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.ROSE_CHEETAH_GAR_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fetch diff
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/antithesishq/demo-data-streaming/compare/main...${{ github.ref_name }}" \
            > git.diff

      - name: Build and Push Config Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./config.Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/demo-data-streaming-config:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/demo-data-streaming-config:git-diff-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Data Generator Image
        uses: docker/build-push-action@v5
        with:
          context: ./data-generator
          file: ./data-generator/faker.Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/data_generator:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/data_generator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push PostgreSQL Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./data-generator
          file: ./data-generator/pgsql_client.Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/pgsql_client:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/pgsql_client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push DynamoDB Image
        uses: docker/build-push-action@v5
        with:
          context: ./dynamoDb
          file: ./dynamoDb/Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/ddd:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/ddd:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Kafka Image
        uses: docker/build-push-action@v5
        with:
          context: ./kafka
          file: ./kafka/kafka.Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/kafka:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/kafka:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Consumer Image
        uses: docker/build-push-action@v5
        with:
          context: ./workload/consumer
          file: ./workload/consumer/Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/consumer:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/consumer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Producer Image
        uses: docker/build-push-action@v5
        with:
          context: ./workload/producer
          file: ./workload/producer/Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/producer:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/producer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Validator Image
        uses: docker/build-push-action@v5
        with:
          context: ./workload/validator
          file: ./workload/validator/Dockerfile
          push: true
          tags: |
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/validator:${{ github.sha }}
            us-central1-docker.pkg.dev/molten-verve-216720/rose-pcheetah-repository/validator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output Image Tags
        run: |
          echo "Images pushed with tags:"
          echo "- demo-data-streaming-config:${{ github.sha }}"
          echo "- data_generator:${{ github.sha }}"
          echo "- pgsql_client:${{ github.sha }}"
          echo "- ddd:${{ github.sha }}"
          echo "- kafka:${{ github.sha }}"
          echo "- consumer:${{ github.sha }}"
          echo "- producer:${{ github.sha }}"
          echo "- validator:${{ github.sha }}"

      - name: Trigger Test on Rose Cheetah
        uses: antithesishq/antithesis-trigger-action@main
        with:
          notebook_name: async_platform
          tenant: rose-cheetah
          username: ${{ secrets.ROSE_CHEETAH_USERNAME }}
          password: ${{ secrets.ROSE_CHEETAH_PASSWORD }}
          github_token: ${{ secrets.GH_PAT }}
          config_image: demo-data-streaming-config:git-diff-latest
          description: "[${{ github.repository }}] CI for ${{ github.ref_name }} (commit ${{ github.sha }})"
          email_recipients: ${{ github.event.inputs.emails || secrets.ZULIP_REPORT_EMAIL }}
          additional_parameters: |-
            custom.duration=${{ github.event.inputs.duration || '0.5' }}
